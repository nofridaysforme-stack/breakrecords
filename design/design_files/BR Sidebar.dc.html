<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<aside style="width:240px;box-sizing:border-box;height:100%;background:#0b0807;border-right:1px solid rgba(255,235,225,.08);padding:20px 14px;display:flex;flex-direction:column;gap:22px;font-family:'Hanken Grotesk',sans-serif;color:#f4ece6">
  <div style="display:flex;align-items:center;gap:10px;padding:4px 8px">
    <div style="width:28px;height:28px;border-radius:7px;background:#ef6a2a;color:#110c0b;display:grid;place-items:center;font:800 14px 'Archivo',sans-serif;font-stretch:125%">B</div>
    <div style="font:800 15px 'Archivo',sans-serif;font-stretch:118%;letter-spacing:-.01em">Break Records.</div>
  </div>
  <div style="border:1px solid rgba(255,235,225,.1);border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center">
    <div><div style="font-size:11px;color:#a8968e">Label</div><div style="font-size:14px;font-weight:600">Northline Records</div></div>
    <div style="font-size:11px;color:#a8968e">⌄</div>
  </div>
  <nav style="display:flex;flex-direction:column;gap:2px;font-size:14px">
    <sc-for list="{{ items }}" as="it" hint-placeholder-count="12">
      <div style="display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;background:{{ it.bg }};color:{{ it.color }};font-weight:{{ it.weight }}">
        <span style="width:6px;height:6px;border-radius:2px;background:{{ it.dot }}"></span>
        <span style="flex:1">{{ it.label }}</span>
        <sc-if value="{{ it.badge }}"><span style="background:#ef6a2a;color:#110c0b;font:600 11px 'IBM Plex Mono',monospace;padding:1px 7px;border-radius:6px">{{ it.badge }}</span></sc-if>
        <sc-if value="{{ it.locked }}"><span style="font:500 10px 'IBM Plex Mono',monospace;border:1px solid rgba(255,235,225,.14);padding:1px 6px;border-radius:5px">Phase 2</span></sc-if>
      </div>
    </sc-for>
  </nav>
  <div style="margin-top:auto;display:flex;flex-direction:column;gap:2px;font-size:13px;color:#a8968e;border-top:1px solid rgba(255,235,225,.08);padding-top:14px">
    <div style="padding:7px 10px">Activity log</div><div style="padding:7px 10px">Settings</div><div style="padding:7px 10px">Help</div>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:240,&quot;height&quot;:900},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Home&quot;,&quot;Approvals&quot;,&quot;Releases&quot;,&quot;Catalog&quot;,&quot;Money&quot;,&quot;Splits&quot;,&quot;Contracts&quot;,&quot;Rights&quot;,&quot;Funding&quot;,&quot;Roster&quot;,&quot;Departments&quot;],&quot;default&quot;:&quot;Home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;count&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:4,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'Home';
    const names = ['Home','Approvals','Releases','Catalog','Money','Splits','Contracts','Rights','Funding','Roster','Departments','Marketing'];
    return { items: names.map(n => {
      const on = n === active, locked = n === 'Marketing';
      return { label: n, bg: on ? '#241817' : 'transparent', color: locked ? '#7d6c65' : on ? '#f4ece6' : '#cdbcb4', weight: on ? 600 : 400, dot: on ? '#ef6a2a' : 'transparent', badge: n === 'Approvals' ? String(this.props.count ?? 4) : '', locked };
    }) };
  }
}
</script>
</body>
</html>
